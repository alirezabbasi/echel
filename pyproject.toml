[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echel"
version = "0.1.0"
description = "Progressive SDLC memory for AI-native software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Echel contributors"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
quality = [
    "bandit>=1.7,<2",
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "twine>=5,<7",
    "types-jsonschema>=4.23,<5",
]

[project.scripts]
echel = "echel.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/echel"]
check_untyped_defs = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "v1", "echelit"]
