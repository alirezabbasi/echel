<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echel Cockpit</title>
  <style>
    :root {
      --bg:#f6f7f9; --surface:#ffffff; --subtle:#eef1f4; --line:#d7dce2;
      --text:#17202a; --muted:#657181; --accent:#0f766e; --accent-2:#b45309;
      --danger:#b91c1c; --ok:#15803d; --ink:#27313d;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); letter-spacing:0; }
    .app { display:grid; grid-template-columns: 248px 1fr; min-height:100vh; }
    aside { background:#202833; color:#f8fafc; padding:18px 14px; display:flex; flex-direction:column; gap:18px; }
    .brand { font-size:20px; font-weight:700; }
    nav { display:grid; gap:4px; }
    nav button { display:flex; align-items:center; gap:10px; width:100%; min-height:38px; border:0; border-radius:6px; padding:9px 10px; background:transparent; color:#cbd5e1; text-align:left; cursor:pointer; }
    nav button.active, nav button:hover { background:#334155; color:white; }
    main { display:grid; grid-template-rows:auto 1fr; min-width:0; }
    header { background:var(--surface); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:22px; line-height:1.2; }
    h2 { margin:0 0 10px; font-size:14px; color:var(--ink); }
    h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; }
    button, input, select { font:inherit; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:6px; min-height:34px; padding:7px 10px; cursor:pointer; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:white; }
    .btn.warn { background:var(--accent-2); border-color:var(--accent-2); color:white; }
    .content { padding:18px 22px 28px; overflow:auto; }
    .grid { display:grid; gap:14px; }
    .cols-4 { grid-template-columns:repeat(4, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
    .cols-2 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
    .metric { display:grid; gap:4px; }
    .metric strong { font-size:26px; }
    .muted { color:var(--muted); }
    .pill { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; border-radius:999px; background:var(--subtle); color:var(--ink); font-size:12px; }
    .pill.ok { background:#dcfce7; color:var(--ok); }
    .pill.danger { background:#fee2e2; color:var(--danger); }
    .list { display:grid; gap:8px; }
    .item { border:1px solid var(--line); border-radius:6px; padding:10px; background:#fbfcfd; }
    .item-title { font-weight:650; margin-bottom:4px; }
    .split { display:grid; grid-template-columns: minmax(0, 1fr) 360px; gap:14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; white-space:pre-wrap; overflow:auto; }
    .nodes { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px; }
    .node { border:1px solid var(--line); border-left:4px solid var(--accent); background:white; border-radius:6px; padding:9px; min-height:72px; }
    .node small { color:var(--muted); display:block; overflow-wrap:anywhere; }
    .form { display:grid; gap:8px; }
    input, select { min-height:36px; border:1px solid var(--line); border-radius:6px; background:white; color:var(--text); padding:8px; width:100%; }
    .stage-shell { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:14px; align-items:start; }
    .stage-map { display:grid; gap:8px; }
    .stage-card { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:10px; background:#fbfcfd; cursor:pointer; }
    .stage-card.blocked { border-left-color:var(--danger); }
    .stage-card.active { outline:2px solid rgba(15,118,110,.22); background:white; }
    .stage-meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .always-on { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .chat-shell { display:grid; grid-template-columns:320px 1fr; gap:14px; }
    .messages { min-height:420px; max-height:58vh; overflow:auto; background:white; border:1px solid var(--line); border-radius:8px; padding:12px; }
    .msg { padding:10px; border-radius:6px; margin:8px 0; white-space:pre-wrap; }
    .user { background:#dbeafe; margin-left:12%; }
    .assistant { background:#f1f5f9; margin-right:12%; }
    .hidden { display:none; }
    @media (max-width: 980px) {
      .app { grid-template-columns:1fr; }
      aside { position:static; }
      .cols-4, .cols-3, .cols-2, .split, .stage-shell, .chat-shell { grid-template-columns:1fr; }
      header { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Echel Cockpit</div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header>
        <div>
          <h1 id="title">Product</h1>
          <div class="muted" id="subtitle"></div>
        </div>
        <div class="toolbar">
          <button class="btn" onclick="runCommand('status')">Status</button>
          <button class="btn" onclick="runCommand('next')">Next</button>
          <button class="btn primary" onclick="runCommand('build')">Build</button>
          <button class="btn warn" onclick="runCommand('review')">Review</button>
        </div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>
<script>
let state = null;
let active = null;
let currentThread = null;

function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
async function api(path, opts={}) {
  const res = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function load() {
  state = await api('/api/cockpit');
  if(!active) active = state.lifecycle?.current?.id || state.lifecycle?.stages?.[0]?.id || 'chat';
  document.getElementById('title').textContent = state.project.title;
  const current = state.lifecycle?.current || {};
  const blockerCount = current.blockers?.length || 0;
  document.getElementById('subtitle').innerHTML = `<div class="always-on"><span class="pill ${current.status === 'blocked' ? 'danger' : 'ok'}">Current: ${esc(current.title || 'Unknown')}</span><span class="pill">${esc(current.role || 'Unassigned')}</span><span class="pill ${blockerCount ? 'danger' : 'ok'}">${blockerCount} blocker${blockerCount === 1 ? '' : 's'}</span><span>${esc(current.next_action || '')}</span></div>`;
  renderNav();
  render();
}
function renderNav(){
  const stages = state.lifecycle?.stages || [];
  const rows = stages.map(stage => {
    const icon = stage.status === 'blocked' ? '!' : '✓';
    return `<button class="${active===stage.id?'active':''}" onclick="setActive('${esc(stage.id)}')"><span>${icon}</span><span>${esc(stage.title)}</span></button>`;
  });
  rows.push(`<button class="${active==='chat'?'active':''}" onclick="setActive('chat')"><span>~</span><span>Chat</span></button>`);
  document.getElementById('nav').innerHTML = rows.join('');
}
function setActive(id){ active=id; renderNav(); render(); }
function metric(label, value, cls=''){return `<div class="panel metric"><span class="muted">${label}</span><strong class="${cls}">${esc(value)}</strong></div>`}
function list(items, empty='None'){return items.length ? `<div class="list">${items.join('')}</div>` : `<div class="muted">${empty}</div>`}
function render(){
  const v = document.getElementById('view');
  if(active==='chat') { v.innerHTML = chat(); initChat(); }
  else v.innerHTML = lifecycleView(active);
}
function lifecycleView(id){
  const stages = state.lifecycle?.stages || [];
  const stage = stages.find(s => s.id === id) || state.lifecycle?.current || stages[0] || {};
  const current = state.lifecycle?.current || stage;
  return `<div class="grid">
    <div class="grid cols-4">
      ${metric('Current Stage', current.title || 'Unknown', current.status === 'blocked' ? 'danger' : 'ok')}
      ${metric('Responsible AI Role', current.role || 'Unassigned')}
      ${metric('Blockers', (current.blockers || []).length, (current.blockers || []).length ? 'danger' : 'ok')}
      ${metric('Open Tasks', state.readiness.open_tasks)}
    </div>
    <div class="stage-shell">
      <div class="grid">
        ${stagePanel(stage)}
        ${stageContext(stage.id)}
      </div>
      <div class="panel"><h2>Lifecycle Flow</h2><div class="stage-map">${stages.map(s=>`<div class="stage-card ${s.status === 'blocked' ? 'blocked' : ''} ${s.id === stage.id ? 'active' : ''}" onclick="setActive('${esc(s.id)}')"><div class="item-title">${esc(s.title)}</div><div class="stage-meta"><span class="pill ${s.status === 'blocked' ? 'danger' : 'ok'}">${esc(s.status)}</span><span class="pill">${esc(s.role)}</span><span class="pill">${(s.blockers||[]).length} blockers</span></div><div class="muted">${esc(s.next_action)}</div></div>`).join('')}</div></div>
    </div>
  </div>`;
}
function stagePanel(stage){
  const blockers = stage.blockers || [];
  const artifacts = stage.artifacts || [];
  const action = stage.safe_action || null;
  return `<div class="panel"><h2>${esc(stage.title || 'Lifecycle Stage')}</h2>
    <div class="stage-meta"><span class="pill ${stage.status === 'blocked' ? 'danger' : 'ok'}">${esc(stage.status || 'unknown')}</span><span class="pill">${esc(stage.role || 'Unassigned')}</span></div>
    <div class="grid cols-2">
      <div><h3>Blockers</h3>${list(blockers.map(x=>`<div class="item">${esc(x)}</div>`), 'No blockers for this stage')}</div>
      <div><h3>Next Action</h3><div class="item">${esc(stage.next_action || 'No action recorded')}</div>${action ? `<div class="toolbar"><button class="btn primary" onclick="runStageAction('${esc(stage.id)}')">${esc(action.label || 'Run Action')}</button></div>` : ''}</div>
    </div>
    <h3>Key Artifacts</h3>${list(artifacts.map(x=>`<div class="item mono">wiki/${esc(x)}</div>`), 'No artifacts registered for this stage')}
  </div>`;
}
function stageContext(id){
  if(id==='discovery') return clarify();
  if(id==='canon') return dashboard();
  if(id==='strategy') return risks();
  if(id==='requirements') return readiness();
  if(id==='domain') return graph();
  if(id==='architecture') return architecture();
  if(id==='roadmap') return roadmap();
  if(id==='execution') return work();
  if(id==='build') return reports('packets');
  if(id==='validate') return reports('reviews');
  if(id==='release') return readiness();
  if(id==='operate') return activity();
  if(id==='governance') return governance();
  return dashboard();
}
function dashboard(){
  const r = state.readiness;
  return `<div class="grid">
    <div class="grid cols-4">
      ${metric('Open Questions', r.clarification_open)}
      ${metric('MVP', r.mvp_ready ? 'Ready' : 'Clarify', r.mvp_ready ? 'ok' : 'danger')}
      ${metric('Open Tasks', r.open_tasks)}
      ${metric('Graph Issues', `${r.graph_critical} critical / ${r.graph_major} major`, r.graph_critical ? 'danger' : 'ok')}
    </div>
    <div class="split">
      <div class="panel"><h2>Product Brief</h2><div class="list">
        <div class="item"><div class="item-title">Problem</div>${esc(state.project.problem || 'TBD')}</div>
        <div class="item"><div class="item-title">Solution</div>${esc(state.project.solution || 'TBD')}</div>
        <div class="item"><div class="item-title">Success</div>${esc(state.project.success || 'TBD')}</div>
      </div></div>
      <div class="panel"><h2>Next Action</h2><div class="item mono">${esc(state.work.next || 'No open task')}</div><div class="toolbar"><button class="btn primary" onclick="runCommand('plan')">Plan</button><button class="btn" onclick="runCommand('graph-report')">Graph Report</button></div></div>
    </div>
  </div>`;
}
function clarify(){
  return `<div class="split"><div class="panel"><h2>Clarification Queue</h2>${list(state.clarifications.map(q =>
    `<div class="item"><div class="item-title">${esc(q.key)}</div>${esc(q.question)}</div>`), 'No open questions')}</div>
    <div class="panel"><h2>Answer</h2><div class="form"><select id="clarify-field">${state.clarifications.map(q=>`<option value="${esc(q.key)}">${esc(q.key)}</option>`).join('')}</select><input id="clarify-answer" placeholder="Answer" /><button class="btn primary" onclick="answerClarification()">Save</button><pre class="mono" id="cmd-out"></pre></div></div></div>`;
}
function roadmap(){
  return `<div class="grid cols-2">${['now','mvp','next','later'].map(k=>`<div class="panel"><h2>${k.toUpperCase()}</h2>${list((state.roadmap[k]||[]).map(x=>`<div class="item">${esc(x)}</div>`))}</div>`).join('')}</div>`;
}
function work(){
  return `<div class="panel"><h2>Work Queue</h2>${list(state.work.tasks.map(t=>`<div class="item"><span class="pill ${t.status==='done'?'ok':''}">${esc(t.status)}</span><div class="item-title">${esc(t.title)}</div><div class="muted">${esc(t.objective)}</div></div>`))}</div>`;
}
function architecture(){
  const a = state.architecture || {components:[], stack:[], workflows:[]};
  return `<div class="grid cols-2">
    <div class="panel"><h2>System Shape</h2><div class="item">${esc(a.system || 'TBD')}</div><h2>Components</h2>${list((a.components||[]).map(x=>`<div class="item">${esc(x)}</div>`))}</div>
    <div class="panel"><h2>Preferred Stack</h2>${list((a.stack||[]).map(x=>`<div class="item">${esc(x)}</div>`))}<h2>Workflows</h2>${list((a.workflows||[]).map(x=>`<div class="item">${esc(x)}</div>`))}</div>
  </div>`;
}
function graph(){
  const grouped = {};
  state.graph.nodes.forEach(n => (grouped[n.type] ||= []).push(n));
  return `<div class="split"><div class="panel"><h2>Graph Explorer</h2><div class="nodes">${Object.keys(grouped).sort().map(type => grouped[type].slice(0,18).map(n=>`<div class="node"><strong>${esc(n.title)}</strong><small>${esc(type)} · ${esc(n.id)}</small></div>`).join('')).join('')}</div></div><div class="panel"><h2>Graph Summary</h2><pre class="mono">${esc(state.graph.summary)}</pre></div></div>`;
}
function reports(kind){
  const rows = state.work[kind] || [];
  return `<div class="panel"><h2>${kind === 'packets' ? 'Build Packets' : 'Review Reports'}</h2>${list(rows.map(r=>`<div class="item"><div class="item-title">${esc(r.title)}</div><div class="muted">${esc(r.path)}</div></div>`))}</div>`;
}
function readiness(){
  const rd = state.readiness_detail || {status:'unknown', issues:[], reports:{readiness:[], proof_packs:[], release_summaries:[]}, states:[]};
  return `<div class="grid">
    <div class="grid cols-3">
      ${metric('Readiness', rd.status)}
      ${metric('Issues', rd.issues.length)}
      ${metric('Target', rd.target || 'mvp')}
    </div>
    <div class="split">
      <div class="panel"><h2>Blockers And Warnings</h2>${list(rd.issues.map(i=>`<div class="item"><span class="pill ${i.severity==='blocker'?'danger':''}">${esc(i.severity)}</span><div>${esc(i.message)}</div></div>`), 'No readiness issues')}</div>
      <div class="panel"><h2>Actions</h2><div class="toolbar"><button class="btn primary" onclick="runCommand('readiness')">Readiness</button><button class="btn" onclick="runCommand('proof-pack')">Proof Pack</button><button class="btn warn" onclick="runCommand('release-summary')">Release Summary</button></div><h2>States</h2>${list((rd.states||[]).map(s=>`<div class="item">${esc(s)}</div>`))}</div>
    </div>
    <div class="grid cols-3">
      <div class="panel"><h2>Readiness Reports</h2>${list((rd.reports.readiness||[]).map(r=>`<div class="item">${esc(r.title)}<div class="muted">${esc(r.path)}</div></div>`))}</div>
      <div class="panel"><h2>Proof Packs</h2>${list((rd.reports.proof_packs||[]).map(r=>`<div class="item">${esc(r.title)}<div class="muted">${esc(r.path)}</div></div>`))}</div>
      <div class="panel"><h2>Release Summaries</h2>${list((rd.reports.release_summaries||[]).map(r=>`<div class="item">${esc(r.title)}<div class="muted">${esc(r.path)}</div></div>`))}</div>
    </div>
  </div>`;
}
function risks(){return `<div class="panel"><h2>Risks</h2>${list(state.risks.map(r=>`<div class="item"><div class="item-title">${esc(r.title)}</div>${esc(r.summary)}</div>`))}</div>`}
function contradictions(){return `<div class="panel"><h2>Contradictions</h2>${list((state.contradictions||[]).map(c=>`<div class="item"><div class="item-title">${esc(c.title)}</div><div class="muted">${esc(c.id)} · ${esc(c.type)}</div></div>`), 'No contradictions recorded')}</div>`}
function activity(){
  const a = state.agent_activity || {packets:[], reviews:[], log:[]};
  return `<div class="grid cols-3">
    <div class="panel"><h2>Packets</h2>${list((a.packets||[]).map(r=>`<div class="item">${esc(r.title)}<div class="muted">${esc(r.path)}</div></div>`))}</div>
    <div class="panel"><h2>Reviews</h2>${list((a.reviews||[]).map(r=>`<div class="item">${esc(r.title)}<div class="muted">${esc(r.path)}</div></div>`))}</div>
    <div class="panel"><h2>Recent Log</h2>${list((a.log||[]).map(x=>`<div class="item">${esc(x)}</div>`))}</div>
  </div>`;
}
function decisions(){return `<div class="panel"><h2>Decisions</h2>${list(state.decisions.map(d=>`<div class="item"><div class="item-title">${esc(d.title)}</div><div class="muted">${esc(d.path)}</div></div>`))}</div>`}
function governance(){return `<div class="grid cols-2"><div>${graph()}</div><div class="grid">${contradictions()}${decisions()}</div></div>`}
function chat(){
  return `<div class="chat-shell"><div class="panel"><h2>Provider</h2><input id="p-name" placeholder="name" /><select id="p-type"><option value="openai">openai</option><option value="anthropic">anthropic</option><option value="openai_compatible">openai_compatible</option></select><input id="p-model" placeholder="model" /><input id="p-base" placeholder="base url" /><input id="p-key" type="password" placeholder="api key" /><button class="btn primary" onclick="connectProvider()">Connect</button><select id="provider-select"></select><h2>Threads</h2><input id="thread-title" placeholder="title" /><button class="btn" onclick="createThread()">Create</button><div id="thread-list" class="list"></div></div><div><div id="chat-messages" class="messages"></div><div class="toolbar"><input id="message" placeholder="Message" /><button class="btn primary" onclick="sendMessage()">Send</button></div></div></div>`;
}
async function command(action,args={}){ const res = await api('/api/cockpit/command',{method:'POST',body:JSON.stringify({action,args})}); await load(); return res; }
async function runCommand(action){ const res = await command(action); alert(res.output || (res.ok ? 'Done' : 'Failed')); }
async function runStageAction(id){ const stage=(state.lifecycle?.stages||[]).find(s=>s.id===id); if(!stage?.safe_action) return; const res = await command(stage.safe_action.action, stage.safe_action.args || {}); alert(res.output || (res.ok ? 'Done' : 'Failed')); }
async function answerClarification(){ const res = await command('clarify',{field:document.getElementById('clarify-field').value, answer:document.getElementById('clarify-answer').value}); document.getElementById('cmd-out').textContent = res.output; }
async function loadProviders(){ const rows = await api('/api/providers'); document.getElementById('provider-select').innerHTML = rows.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.model)})</option>`).join(''); }
async function connectProvider(){ await api('/api/providers/connect',{method:'POST',body:JSON.stringify({name:pval('p-name'),provider_type:pval('p-type'),base_url:pval('p-base'),model:pval('p-model'),api_key:pval('p-key')})}); await loadProviders(); }
function pval(id){ return document.getElementById(id).value; }
async function loadThreads(){ const rows = await api('/api/threads'); document.getElementById('thread-list').innerHTML = rows.map(t=>`<button class="btn" onclick="openThread(${t.id})">#${t.id} ${esc(t.title)}</button>`).join(''); }
async function createThread(){ const res = await api('/api/threads',{method:'POST',body:JSON.stringify({title:pval('thread-title') || 'New Thread'})}); await loadThreads(); await openThread(res.thread_id); }
async function openThread(id){ currentThread=id; const rows=await api(`/api/threads/${id}/messages`); document.getElementById('chat-messages').innerHTML=rows.map(r=>`<div class="msg ${r.role}">${esc(r.content)}</div>`).join(''); }
async function sendMessage(){ if(!currentThread) return; const message=pval('message').trim(); if(!message) return; document.getElementById('message').value=''; const providerId=pval('provider-select'); await api('/api/chat',{method:'POST',body:JSON.stringify({thread_id:currentThread, provider_id:providerId ? Number(providerId) : null, message})}); await openThread(currentThread); }
async function initChat(){ await loadProviders(); await loadThreads(); }
load().catch(err => { document.getElementById('view').innerHTML = `<div class="panel danger">${esc(err.message)}</div>`; });
</script>
</body>
</html>
